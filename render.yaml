# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint · Virundhu
# One-click "New → Blueprint" in the Render dashboard uses this file to spin
# up the Next.js web app + NestJS API. The database lives on Neon (managed
# PostgreSQL) — see Docs/Deployment.md for why we do not use Render's own
# free Postgres (90-day expiry).
#
# After the blueprint is created, set these secrets in the Render dashboard:
#   virundhu-api   → DATABASE_URL, JWT_SECRET
#   virundhu-web   → NEXT_PUBLIC_API_URL  (paste the deployed API URL)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── NestJS API ────────────────────────────────────────────────────────────
  - type: web
    name: virundhu-api
    runtime: node
    plan: free                       # upgrade to "starter" ($7/mo) for no cold starts
    region: singapore                # closest Render region to Tamil Nadu
    rootDir: .
    buildCommand: npm ci && npm run build:shared && npm run build:api && npx prisma generate --schema=apps/api/prisma/schema.prisma
    startCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && node apps/api/dist/main.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"               # Render exposes this port on $PORT
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: virundhu-web
          property: hostport         # e.g. virundhu-web.onrender.com — Render fills this in
      - key: JWT_SECRET
        generateValue: true          # Render creates & stores a 256-bit secret
      - key: DATABASE_URL
        sync: false                  # ⚠  paste Neon connection string in dashboard

  # ── Next.js web ───────────────────────────────────────────────────────────
  - type: web
    name: virundhu-web
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm ci && npm run build:shared && npm run build:web
    startCommand: npm run start --workspace=@cartsas/web
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_REPO_BACKEND
        value: "api"
      - key: NEXT_PUBLIC_API_URL
        sync: false                  # ⚠  paste https://virundhu-api.onrender.com/api after first deploy
