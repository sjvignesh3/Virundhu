# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint · Virundhu (API only)
#
# Hosting split:
#   • Frontend  → Vercel  (see apps/web/vercel.json)
#   • Backend   → Render  (this file)
#   • Database  → Supabase Postgres
#
# One-click "New → Blueprint" in the Render dashboard uses this file to spin
# up the NestJS API. See Docs/Deployment.md for the full walkthrough.
#
# After the blueprint is created, set these secrets in the Render dashboard
# for the "virundhu-api" service:
#   • DATABASE_URL  → Supabase pooled connection string
#   • CORS_ORIGIN   → https://<your-app>.vercel.app,https://*.vercel.app
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: virundhu-api
    runtime: node
    plan: free                       # upgrade to "starter" ($7/mo) for no cold starts
    region: singapore                # closest Render region to Tamil Nadu
    rootDir: .
    buildCommand: npm ci && npm run build:shared && npm run build:api && npx prisma generate --schema=apps/api/prisma/schema.prisma
    startCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && node apps/api/dist/main.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"               # Render maps this to $PORT
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: JWT_SECRET
        generateValue: true          # Render generates & stores a 256-bit secret
      - key: DATABASE_URL
        sync: false                  # ⚠  paste Supabase pooled URL in dashboard
      - key: CORS_ORIGIN
        sync: false                  # ⚠  paste your Vercel URL(s) in dashboard
