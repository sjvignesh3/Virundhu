#   2. Restore the `perform public.notify_order_transition(...)` calls in
#      the `orders_advance_status` / `orders_cancel` RPCs
#      (migration 20260901002500).
#   3. Redeploy: `supabase functions deploy notify-order-transition razorpay-webhook`.
# ───────────────────────────────────────────────────────────────────────────

